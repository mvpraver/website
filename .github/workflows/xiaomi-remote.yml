name: Build Xiaomi Remote IPA

on:
  push:
    paths:
      - 'XiaomiRemote/**'
      - '.github/workflows/xiaomi-remote.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare app icon
        working-directory: XiaomiRemote
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          src = Path('Sources/Icon180.base64.txt')
          dst = Path('Sources/Assets.xcassets/AppIcon.appiconset/Icon180.png')
          dst.write_bytes(base64.b64decode(src.read_text().strip()))
          print('icon bytes:', dst.stat().st_size)
          PY

      - name: Generate Xcode project
        working-directory: XiaomiRemote
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: XiaomiRemote
        run: |
          xcodebuild \
            -project XiaomiRemote.xcodeproj \
            -scheme XiaomiRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package IPA
        working-directory: XiaomiRemote
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry RedmiNote9Pro.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RedmiNote9Pro-IPA
          path: XiaomiRemote/RedmiNote9Pro.ipa
          if-no-files-found: error
